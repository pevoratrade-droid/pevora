<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pevora Enterprises</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: deep emerald header band and login with gold hairlines; content on pale stone with white cards. One committed look, no theme switching. */
:root {
  --bg: #f2f3ee;
  --surface: #ffffff;
  --ink: #12231c;
  --muted: #5c6d65;
  --line: #e1e3d8;
  --emerald: #08261c;
  --emerald-2: #0d3a2a;
  --green: #0d5136;
  --gold: #c9a45a;
  --gold-deep: #8a6a22;
  --gold-soft: #f4ecd8;
  --on-gold: #1b1606;
  --good: #1d7a4b;
  --bad: #b23f29;
  --display: "Marcellus", "Palatino Linotype", Georgia, serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body[data-screen="login"] { background: radial-gradient(120% 90% at 50% 0%, #0f4a35 0%, var(--emerald) 60%, #051a13 100%); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--emerald); z-index: 11; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 980px; margin: 0 auto; }
[hidden] { display: none !important; }

/* buttons + fields */
.btn { background: linear-gradient(135deg, #dcc07a, #bd9540); color: var(--on-gold); border: 1px solid #b08a38; border-radius: 8px; padding: 9px 16px; font-weight: 600; letter-spacing: .01em; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; color: var(--green); border-color: var(--green); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
.field input, .field select, .field textarea, .bar input {
  width: 100%; background: #fbfbf8; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0;
}
.field input:focus, .field select:focus, .field textarea:focus, .bar input:focus { border-color: var(--gold); }
.field textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.full { grid-column: 1 / -1; }
.err { color: var(--bad); font-size: 14px; min-height: 20px; }

/* login */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 0; }
.login-card { width: 100%; max-width: 390px; background: var(--surface); border-radius: 14px; padding: 26px 24px; display: grid; gap: 14px; border-top: 4px solid var(--gold); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.login-logo { justify-self: center; }
.login-logo img { display: block; width: 220px; max-width: 100%; height: auto; }
.login-card p { margin: 0; color: var(--muted); text-align: center; font-size: 14px; }

/* header + nav */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--emerald); box-shadow: 0 0 0 100vmax var(--emerald); clip-path: inset(0 -100vmax); padding: 12px 0 0; border-bottom: 1px solid var(--gold); }
.head-row { display: flex; align-items: center; gap: 12px; }
.mark { background: #fff; border-radius: 8px; padding: 3px; display: grid; place-items: center; border: 1px solid var(--gold); }
.mark img { display: block; height: 38px; width: auto; }
.title { flex: 1; min-width: 0; }
.title h1 { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; line-height: 1.1; color: #f3ead2; }
.title span { color: var(--gold); font-size: 11.5px; letter-spacing: .32em; text-transform: uppercase; }
.head .btn.ghost { color: #f3ead2; border-color: rgba(201, 164, 90, .6); }
.nav { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 12px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { flex: none; border: 1px solid transparent; background: none; padding: 7px 13px; border-radius: 99px; cursor: pointer; color: #b9c9c0; font-weight: 500; }
.nav button:hover { color: #fff; }
.nav button[aria-current="page"] { background: linear-gradient(135deg, #dcc07a, #bd9540); color: var(--on-gold); font-weight: 600; }
.nav .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 99px; background: #fff; color: var(--emerald); font-size: 11px; font-weight: 700; text-align: center; }
main { padding-top: 18px; display: grid; gap: 14px; }

/* common blocks */
.bar { display: flex; gap: 8px; flex-wrap: wrap; }
.bar input { flex: 1 1 180px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; box-shadow: 0 1px 2px rgba(8, 38, 28, .05); }
.panel h2 { font-size: 19px; margin-bottom: 10px; color: var(--emerald); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 12px; min-width: 0; box-shadow: 0 1px 2px rgba(8, 38, 28, .05); }
.kpi .l { color: var(--muted); font-size: 12.5px; letter-spacing: .04em; }
.kpi .v { font-family: var(--display); font-size: 25px; overflow-wrap: anywhere; color: var(--emerald); }
.welcome { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 26px 16px; }
.welcome h2 { margin: 0; }
.welcome p { margin: 0; color: var(--muted); max-width: 440px; }
.list { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(8, 38, 28, .04); }
.item:hover { border-color: var(--gold); }
.item b { font-weight: 600; overflow-wrap: anywhere; }
.item .sub { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.item .r { text-align: right; display: grid; gap: 4px; justify-items: end; align-content: start; }
.item .amt { font-weight: 600; color: var(--emerald); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: #fbfbf8; }
.chip.green { color: var(--good); border-color: var(--good); }
.chip.gold { color: var(--gold-deep); border-color: var(--gold); background: var(--gold-soft); }
.chip.red { color: var(--bad); border-color: var(--bad); }
.empty { color: var(--muted); text-align: center; padding: 22px 8px; }
.group { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-deep); margin: 6px 0 -2px; font-weight: 600; }

/* sheet */
.overlay { position: fixed; inset: 0; background: rgba(5, 26, 19, .6); z-index: 50; display: grid; place-items: center; padding: 16px; overflow: auto; }
.sheet { background: var(--surface); border-top: 4px solid var(--gold); border-radius: 12px; width: 100%; max-width: 720px; max-height: calc(100dvh - 32px); overflow: auto; padding: 18px; display: grid; gap: 14px; align-content: start; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.sheet-head h2 { font-size: 22px; overflow-wrap: anywhere; color: var(--emerald); }
.sheet h3 { color: var(--emerald); font-size: 17px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kv { display: grid; gap: 6px; font-size: 14.5px; }
.kv div { display: flex; gap: 8px; flex-wrap: wrap; }
.kv span:first-child { color: var(--muted); min-width: 100px; }
.kv span:last-child { overflow-wrap: anywhere; user-select: all; }
.irow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fbfbf8; }
.irow .iname { grid-column: 1 / -1; }
.irow input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-width: 0; }
.irow .iamt { grid-column: 1 / -1; font-weight: 600; text-align: right; color: var(--emerald); }
.irow .rm { grid-column: 1 / -1; justify-self: start; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.totals { display: grid; gap: 4px; justify-items: end; font-size: 15px; }
.totals b { font-family: var(--display); font-size: 21px; font-weight: 400; color: var(--emerald); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--emerald); color: #f3ead2; border: 1px solid var(--gold); padding: 9px 16px; border-radius: 99px; z-index: 80; font-size: 14px; }
.docwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
</style>

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  function pad(n, l) { n = String(n); while (n.length < l) n = "0" + n; return n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1, 2) + "-" + pad(d.getDate(), 2); }
  function today() { return iso(new Date()); }
  function addDays(s, n) { var p = s.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return iso(d); }
  function dnum(s) { var p = s.split("-"); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
  function fdate(s) { if (!s) return "Not set"; var p = s.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
  function n2(n) { return (+n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function inr(n) { return "₹" + n2(n); }
  function inr0(n) { return "₹" + Math.round(+n || 0).toLocaleString("en-IN"); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2200); }
  function copy(text, label) {
    function fallback() { toast("Select and copy: " + text); }
    try { navigator.clipboard.writeText(text).then(function () { toast((label || "Text") + " copied"); }, fallback); } catch (e) { fallback(); }
  }

  /* ---------- storage ---------- */
  var mem = null;
  function seed() {
    return { seq: { q: 1, i: 1 }, company: { address: "", phone: "", email: "", gst: "", bank: "" }, buyers: [], sellers: [], products: [], quotes: [], invoices: [] };
  }
  function clean(d) {
    ["buyers", "sellers", "products", "quotes", "invoices"].forEach(function (k) { d[k] = (d[k] || []).filter(function (x) { return !x.ex; }); });
    d.quotes = d.quotes.filter(function (q) { return byId(d.buyers, q.buyerId); });
    d.company = d.company || {};
    if (!d.seq || (!d.quotes.length && !d.invoices.length)) d.seq = { q: 1, i: 1 };
    return d;
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) { try { return clean(JSON.parse(raw)); } catch (e) {} }
    return mem || seed();
  }
  var D = load();
  function save() { mem = D; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }

  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function buyerName(id) { var b = byId(D.buyers, id); return b ? b.name : "Unknown buyer"; }
  function docTotals(d) {
    var sub = 0; (d.items || []).forEach(function (it) { sub += (+it.qty || 0) * (+it.rate || 0); });
    var tax = sub * (+d.tax || 0) / 100;
    return { sub: sub, tax: tax, total: sub + tax };
  }
  function invStatus(inv) {
    var t = docTotals(inv).total, paid = +inv.paid || 0;
    if (t > 0 && paid >= t - 0.005) return "Paid";
    if (inv.dueDate && inv.dueDate < today()) return "Overdue";
    return paid > 0 ? "Partial" : "Unpaid";
  }
  function waLink(phone, text) {
    var d = String(phone || "").replace(/\D/g, ""); if (d.length === 10) d = "91" + d;
    return "https://wa.me/" + d + "?text=" + encodeURIComponent(text || "");
  }
  function followState(b) {
    if (!b.nextFollow) return null;
    var t = today();
    return b.nextFollow < t ? "overdue" : b.nextFollow === t ? "today" : "upcoming";
  }
  function followChip(b) {
    var f = followState(b); if (!f) return "";
    if (f === "overdue") return '<span class="chip red">Follow-up overdue ' + fdate(b.nextFollow) + "</span>";
    if (f === "today") return '<span class="chip gold">Follow up today</span>';
    return '<span class="chip">Follow-up ' + fdate(b.nextFollow) + "</span>";
  }

  function closeSheet() { $("overlay").hidden = true; $("overlay").innerHTML = ""; sheetCtl = null; }
  $("overlay").addEventListener("mousedown", function (e) { if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });

  function fieldHTML(f, v) {
    var val = v == null ? "" : v, id = "f_" + f.k, cls = "field" + (f.full ? " full" : ""), inner;
    if (f.type === "select") {
      inner = '<select id="' + id + '" name="' + f.k + '">' + f.options.map(function (o) {
        var ov = typeof o === "string" ? o : o.v, ol = typeof o === "string" ? o : o.l;

      }).join("") + "</select>";
    } else if (f.type === "textarea") {
      inner = '<textarea id="' + id + '" name="' + f.k + '">' + esc(val) + "</textarea>";
    } else {
      inner = '<input id="' + id + '" name="' + f.k + '" type="' + (f.type || "text") + '" value="' + esc(val) + '"' + (f.type === "number" ? ' step="any" min="0" inputmode="decimal"' : "") + (f.req ? " required" : "") + (f.list ? ' list="dl_' + f.k + '"' : "") + ">" + (f.list ? '<datalist id="dl_' + f.k + '">' + f.list.map(function (o) { return '<option value="' + o + '">'; }).join("") + "</datalist>" : "");

      var recent = D.quotes.map(function (d) { return ["quote", d]; }).concat(D.invoices.map(function (d) { return ["invoice", d]; })).sort(function (a, b) { return a[1].date < b[1].date ? 1 : -1; }).slice(0, 4);
      var empty = !(D.buyers.length || D.sellers.length || D.products.length || D.quotes.length || D.invoices.length);
      return (empty ? '<div class="panel welcome"><h2>Welcome to Pevora Enterprises</h2><p>Add your products and sellers first, then your buyers. After that you can make quotations and invoices and track every follow-up.</p><div class="actions"><button class="btn" type="button" data-add="product">+ Add product</button><button class="btn ghost" type="button" data-add="seller">+ Add seller</button><button class="btn ghost" type="button" data-add="buyer">+ Add buyer</button></div></div>' : "") +
        '<div class="kpis"><div class="kpi"><div class="l">Buyers</div><div class="v num">' + D.buyers.length + '</div></div><div class="kpi gold"><div class="l">Follow-ups due</div><div class="v num">' + due.length + '</div></div><div class="kpi"><div class="l">Open quotations</div><div class="v num">' + inr0(qVal) + '</div></div><div class="kpi"><div class="l">Invoiced</div><div class="v num">' + inr0(inv) + '</div></div><div class="kpi"><div class="l">Yet to receive</div><div class="v num">' + inr0(out) + "</div></div></div>" +
        '<div class="panel"><h2>Follow up now</h2><div class="list">' + (due.map(buyerCard).join("") || '<div class="empty">Nothing due today.</div>') + "</div></div>" +
        '<div class="panel"><h2>Latest documents</h2><div class="list">' + (recent.map(function (r) { return docCard(r[0], r[1]); }).join("") || '<div class="empty">No quotations or invoices yet.</div>') + "</div></div>" +
        '<div class="actions"><button class="btn" type="button" data-add="buyer">+ Buyer</button><button class="btn" type="button" data-add="quote">+ Quotation</button><button class="btn" type="button" data-add="invoice">+ Invoice</button></div>';
    },
    followups: function () {
      var list = D.buyers.filter(function (b) { return b.nextFollow; }).sort(function (a, b) { return a.nextFollow < b.nextFollow ? -1 : 1; });
      var g = { overdue: [], today: [], upcoming: [] }; list.forEach(function (b) { g[followState(b)].push(b); });
      function block(t, arr) { return arr.length ? '<div class="group">' + t + "</div>" + arr.map(function (b) { return buyerCard(b) + '<div class="actions" style="margin:-2px 0 4px"><button class="btn sm" type="button" data-follow="' + b.id + '">Done / reschedule</button></div>'; }).join("") : ""; }
      return '<div class="list">' + (block("Overdue", g.overdue) + block("Today", g.today) + block("Upcoming", g.upcoming) || '<div class="empty">No follow-ups scheduled. Set a next follow-up date on a buyer.</div>') + "</div>";
    },
    buyers: function () { return searchBar("+ Add buyer", "buyer") + '<div class="list" id="list"></div>'; },
    quotes: function () { return searchBar("+ New quotation", "quote") + '<div class="list" id="list"></div>'; },
    invoices: function () { return searchBar("+ New invoice", "invoice") + '<div class="list" id="list"></div>'; },
    products: function () { return searchBar("+ Add product", "product") + '<div class="list" id="list"></div>'; },
    sellers: function () { return searchBar("+ Add seller", "seller") + '<div class="list" id="list"></div>'; },
    settings: function () {
      var c = D.company || {};
      return '<div class="panel"><h2>Business details on documents</h2><form id="cf"><div class="grid2">' +
        [["address", "Address"], ["phone", "Phone"], ["email", "Email"], ["gst", "GSTIN"]].map(function (f) { return fieldHTML({ k: f[0], label: f[1] }, c[f[0]]); }).join("") +
        fieldHTML({ k: "bank", label: "Bank details for invoices", type: "textarea", full: 1 }, c.bank) +
        '</div><div class="actions" style="margin-top:12px"><button class="btn" type="submit">Save details</button></div></form></div>' +
        '<div class="panel"><h2>Backup</h2><p style="margin-top:0;color:var(--muted)">Your records are kept in this browser. Download a backup now and then, and restore it on another device.</p><div class="actions"><button class="btn" type="button" data-set="backup">Download backup</button><button class="btn ghost" type="button" data-set="restore">Restore backup</button><button class="btn ghost" type="button" data-set="csvb">Buyers (CSV)</button><button class="btn ghost" type="button" data-set="csvp">Products (CSV)</button></div><input type="file" id="rf" accept=".json,application/json" hidden></div>' +
        "";
    }
  };
  var L = {
    buyers: function () { return D.buyers.filter(function (b) { return match([b.name, b.company, b.phone, b.email, b.address].join(" ")); }).map(buyerCard).join("") || '<div class="empty">No buyers found.</div>'; },
    quotes: function () { return D.quotes.filter(function (d) { return match(d.no + " " + buyerName(d.buyerId)); }).map(function (d) { return docCard("quote", d); }).join("") || '<div class="empty">No quotations yet.</div>'; },
    invoices: function () { return D.invoices.filter(function (d) { return match(d.no + " " + buyerName(d.buyerId)); }).map(function (d) { return docCard("invoice", d); }).join("") || '<div class="empty">No invoices yet. Make one from a quotation or add one directly.</div>'; },
    products: function () {
      return D.products.filter(function (p) { return match(p.name); }).map(function (p) {
        var s = byId(D.sellers, p.sellerId), m = (+p.rate || 0) - (+p.buyRate || 0);
        return '<button class="item" type="button" data-open="product" data-id="' + p.id + '"><div><b>' + esc(p.name) + '</b><div class="sub">' + esc(s ? s.name : "No seller") + " · Seller rate " + inr(p.buyRate) + " / " + esc(p.unit || "kg") + '</div></div><div class="r"><span class="amt num">' + inr(p.rate) + " / " + esc(p.unit || "kg") + '</span><span class="chip ' + (m >= 0 ? "green" : "red") + '">Margin ' + inr(m) + "</span></div></button>";
      }).join("") || '<div class="empty">No products yet.</div>';
    },
    sellers: function () {
      return D.sellers.filter(function (s) { return match([s.name, s.company, s.phone, s.supplies].join(" ")); }).map(function (s) {
        return '<button class="item" type="button" data-open="seller" data-id="' + s.id + '"><div><b>' + esc(s.name) + '</b><div class="sub">' + esc([s.company, s.phone].filter(Boolean).join(" · ") || "No contact details") + '</div></div><div class="r sub">' + esc(s.supplies || "") + "</div></button>";
      }).join("") || '<div class="empty">No sellers yet.</div>';
    }
  };
  function renderList() { var el = $("list"); if (el && L[state.view]) el.innerHTML = L[state.view](); }
  function renderAll() { renderNav(); $("view").innerHTML = V[state.view](); renderList(); }

  /* ---------- settings actions ---------- */
  function csv(rows) { return rows.map(function (r) { return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n"); }
  function saveFile(name, data) {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { toast("Downloads are not available here"); return; }
      dl.save({ filename: name, data: data }).then(function () { toast("Saved"); }, function (e) { if (e && e.code !== "declined") toast("Could not save the file"); });
    }, function () { toast("Downloads are not available here"); });
  }
  function setAction(a) {
    if (a === "backup") saveFile("pevora-backup-" + today() + ".json", JSON.stringify(D));
    else if (a === "restore") $("rf").click();
    else if (a === "csvb") saveFile("pevora-buyers.csv", csv([["Name", "Company", "Phone", "Email", "Address", "GSTIN", "Enquiry date", "Next follow-up", "Status"]].concat(D.buyers.map(function (b) { return [b.name, b.company, b.phone, b.email, b.address, b.gst, b.date, b.nextFollow, b.status]; }))));
    else if (a === "csvp") saveFile("pevora-products.csv", csv([["Product", "Unit", "Seller", "Seller rate", "Pevora rate"]].concat(D.products.map(function (p) { var s = byId(D.sellers, p.sellerId); return [p.name, p.unit || "kg", s ? s.name : "", p.buyRate, p.rate]; }))));
    else if (a === "clearex") {
      ["buyers", "sellers", "products", "quotes", "invoices"].forEach(function (k) { D[k] = D[k].filter(function (x) { return !x.ex; }); });
      D.quotes = D.quotes.filter(function (q) { return byId(D.buyers, q.buyerId); }); save(); renderAll(); toast("Example entries removed");
    }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-nav],[data-open],[data-add],[data-follow],[data-set],[data-x]"); if (!t) return;
    if (t.dataset.nav) { state.view = t.dataset.nav; state.q = ""; renderAll(); window.scrollTo(0, 0); return; }
    if (t.dataset.x) { if (t.dataset.x === "close") closeSheet(); else if (sheetCtl && sheetCtl[t.dataset.x]) sheetCtl[t.dataset.x](); return; }
    if (t.dataset.set) { setAction(t.dataset.set); return; }
    if (t.dataset.follow) { followForm(byId(D.buyers, t.dataset.follow)); return; }
    if (t.dataset.add) {
      var k = t.dataset.add;
      if (k === "buyer") buyerForm(); else if (k === "seller") sellerForm(); else if (k === "product") productForm();
      else docForm(k); return;
    }
    if (t.dataset.open) {
      var o = t.dataset.open, id = t.dataset.id;
      if (o === "buyer") openBuyer(id); else if (o === "seller") openSeller(id); else if (o === "product") productForm(byId(D.products, id));
      else openDoc(o, id);
    }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "q") { state.q = e.target.value; renderList(); } });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "cf") {
      e.preventDefault(); var fd = new FormData(e.target); D.company = {};
      ["address", "phone", "email", "gst", "bank"].forEach(function (k) { D.company[k] = String(fd.get(k) || "").trim(); });
      save(); toast("Details saved");
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id !== "rf" || !e.target.files[0]) return;
    var fr = new FileReader();
    fr.onload = function () {
      try { var j = JSON.parse(fr.result); if (!j.buyers || !j.products) throw 0; D = clean(j); save(); renderAll(); toast("Backup restored"); } catch (x) { toast("That file is not a Pevora backup"); }
    };
    fr.readAsText(e.target.files[0]); e.target.value = "";
  });

  /* ---------- sign in ---------- */
  function sha(s) {
    if (!(window.crypto && crypto.subtle)) return Promise.reject();
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode("pevora|" + s)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return pad(x.toString(16), 2); }).join("");
    });
  }
  var authed = false;
  try { authed = sessionStorage.getItem("pev-auth") === "1"; } catch (e) {}
  function showApp() { document.body.removeAttribute("data-screen"); $("login").hidden = true; $("app").hidden = false; renderAll(); }
  function showLogin() { document.body.setAttribute("data-screen", "login"); $("app").hidden = true; $("login").hidden = false; $("uid").value = ""; $("pw").value = ""; }
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("uid").value.trim().toUpperCase(), p = $("pw").value.trim().toUpperCase();
    Promise.all([sha(u), sha(p)]).then(function (h) {
      if (h[0] === H_ID && h[1] === H_PW) {
        authed = true; try { sessionStorage.setItem("pev-auth", "1"); } catch (x) {}
        $("loginErr").textContent = ""; showApp();
      } else { $("loginErr").textContent = "The ID or password is not correct."; $("pw").value = ""; }
    }, function () { $("loginErr").textContent = "This browser cannot check the sign-in. Try another browser."; });
  });
  $("logout").addEventListener("click", function () { authed = false; try { sessionStorage.removeItem("pev-auth"); } catch (e) {} closeSheet(); showLogin(); });
  if (authed) showApp(); else showLogin();
})();
</script>

</body></html>
